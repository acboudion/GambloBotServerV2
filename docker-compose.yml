services:
  alpaca-news-mcp:
    build: .
    image: alpaca-news-mcp:latest
    container_name: alpaca-news-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - alpaca-news-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read(); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1

volumes:
  alpaca-news-data:
