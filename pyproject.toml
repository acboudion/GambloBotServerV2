[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "alpaca-news-mcp"
version = "0.1.0"
description = "Alpaca real-time news WebSocket MCP server with SQLite persistence and bounded MCP tools."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "alpaca-news-mcp" }]
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=1.0.0",
  "websockets>=13.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.8.0",
  "beautifulsoup4>=4.12.0",
  "python-dateutil>=2.9.0",
  "orjson>=3.10.0",
  "uvicorn>=0.30.0",
  "starlette>=0.40.0",
  "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "types-beautifulsoup4",
  "types-python-dateutil",
]

[project.scripts]
alpaca-news-mcp = "alpaca_news_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_news_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/alpaca_news_mcp/schema.sql" = "alpaca_news_mcp/schema.sql"
"src/alpaca_news_mcp/market_schema.sql" = "alpaca_news_mcp/market_schema.sql"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
